<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="A hash of the email picks exactly one shard" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>A hash of the email picks exactly one shard</title>
  <defs>
    <marker id="s-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
    <marker id="s-arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#111827">A hash of the email picks exactly one shard</text>

  <g fill="none" stroke="#6b7280" stroke-width="1.25">
    <path d="M144 184H190" marker-end="url(#s-arrow)"/>
    <path d="M330 184H400V94H470" stroke-dasharray="4 4" marker-end="url(#s-arrow)"/>
    <path d="M330 184H400V154H470" stroke-dasharray="4 4" marker-end="url(#s-arrow)"/>
    <path d="M330 184H400V274H470" stroke-dasharray="4 4" marker-end="url(#s-arrow)"/>
  </g>
  <path d="M330 184H400V214H470" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#s-arrow-hot)"/>

  <rect x="24" y="160" width="120" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="84" y="180" text-anchor="middle" font-weight="600" fill="#111827">App</text>
  <text x="84" y="198" text-anchor="middle" font-size="11.5" fill="#4b5563">email lookup</text>

  <rect x="190" y="160" width="140" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="260" y="180" text-anchor="middle" font-weight="600" fill="#111827">Router</text>
  <text x="260" y="198" text-anchor="middle" font-size="11.5" fill="#4b5563">hash(email) % 4</text>

  <rect x="470" y="70" width="250" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="595" y="90" text-anchor="middle" font-weight="600" fill="#111827">Shard 0</text>
  <text x="595" y="108" text-anchor="middle" font-size="11.5" fill="#4b5563">server + B-Tree index on email</text>

  <rect x="470" y="130" width="250" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="595" y="150" text-anchor="middle" font-weight="600" fill="#111827">Shard 1</text>
  <text x="595" y="168" text-anchor="middle" font-size="11.5" fill="#4b5563">server + B-Tree index on email</text>

  <rect x="470" y="190" width="250" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="595" y="210" text-anchor="middle" font-weight="600" fill="#111827">Shard 2</text>
  <text x="595" y="228" text-anchor="middle" font-size="11.5" fill="#4b5563">example: hash % 4 = 2</text>

  <rect x="470" y="250" width="250" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="595" y="270" text-anchor="middle" font-weight="600" fill="#111827">Shard 3</text>
  <text x="595" y="288" text-anchor="middle" font-size="11.5" fill="#4b5563">server + B-Tree index on email</text>

  <text x="380" y="326" text-anchor="middle" font-size="11.5" fill="#4b5563">The same email always hashes to the same shard, so one lookup touches one of four</text>
</svg>
