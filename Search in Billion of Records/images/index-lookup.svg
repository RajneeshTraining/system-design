<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="An index narrows a billion rows to one in a few hops" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>An index narrows a billion rows to one in a few hops</title>
  <defs>
    <marker id="idx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
    <marker id="idx-arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#111827">An index narrows a billion rows to one in a few hops</text>
  <text x="24" y="50" font-size="11.5" fill="#4b5563">Looking up asha@example.com</text>

  <g fill="none" stroke="#6b7280" stroke-width="1.25">
    <path d="M380 128V148H380V170" marker-end="url(#idx-arrow)"/>
    <path d="M380 128V148H630V170" marker-end="url(#idx-arrow)"/>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="2">
    <path d="M380 128V148H130V170" marker-end="url(#idx-arrow-hot)"/>
    <path d="M130 218V258" marker-end="url(#idx-arrow-hot)"/>
    <path d="M225 282H305" marker-end="url(#idx-arrow-hot)"/>
  </g>

  <rect x="295" y="80" width="170" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="100" text-anchor="middle" font-weight="600" fill="#111827">Root page</text>
  <text x="380" y="118" text-anchor="middle" font-size="11.5" fill="#4b5563">emails a to z</text>

  <rect x="45" y="170" width="170" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="190" text-anchor="middle" font-weight="600" fill="#111827">Branch page</text>
  <text x="130" y="208" text-anchor="middle" font-size="11.5" fill="#4b5563">emails a to h</text>

  <rect x="295" y="170" width="170" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="380" y="190" text-anchor="middle" font-weight="600" fill="#111827">Branch page</text>
  <text x="380" y="208" text-anchor="middle" font-size="11.5" fill="#4b5563">emails i to p</text>
  <text x="380" y="236" text-anchor="middle" font-size="11.5" fill="#4b5563">skipped</text>

  <rect x="545" y="170" width="170" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="630" y="190" text-anchor="middle" font-weight="600" fill="#111827">Branch page</text>
  <text x="630" y="208" text-anchor="middle" font-size="11.5" fill="#4b5563">emails q to z</text>
  <text x="630" y="236" text-anchor="middle" font-size="11.5" fill="#4b5563">skipped</text>

  <rect x="35" y="258" width="190" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="278" text-anchor="middle" font-weight="600" fill="#111827">Leaf page</text>
  <text x="130" y="296" text-anchor="middle" font-size="11.5" fill="#4b5563">asha@example.com</text>

  <rect x="305" y="258" width="170" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="278" text-anchor="middle" font-weight="600" fill="#111827">Table row</text>
  <text x="390" y="296" text-anchor="middle" font-size="11.5" fill="#4b5563">id 8841207311</text>

  <text x="265" y="274" text-anchor="middle" font-size="11.5" fill="#4b5563">row pointer</text>
</svg>
