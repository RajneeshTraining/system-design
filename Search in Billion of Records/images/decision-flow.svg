<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Pick the simplest option that fits, then add speed and privacy layers" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Pick the simplest option that fits, then add speed and privacy layers</title>
  <defs>
    <marker id="d-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#111827">Pick the simplest option that fits, then add speed and privacy layers</text>

  <g fill="none" stroke="#6b7280" stroke-width="1.25">
    <path d="M154 108V150" marker-end="url(#d-arrow)"/>
    <path d="M154 198V240" marker-end="url(#d-arrow)"/>
    <path d="M154 288V330" marker-end="url(#d-arrow)"/>
    <path d="M284 84H420" marker-end="url(#d-arrow)"/>
    <path d="M284 174H420" marker-end="url(#d-arrow)"/>
    <path d="M284 264H420" marker-end="url(#d-arrow)"/>
  </g>

  <rect x="24" y="60" width="260" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="154" y="89" text-anchor="middle" font-weight="600" fill="#111827">Only exact email match?</text>
  <rect x="24" y="150" width="260" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="154" y="179" text-anchor="middle" font-weight="600" fill="#111827">Fits on one strong server?</text>
  <rect x="24" y="240" width="260" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="154" y="269" text-anchor="middle" font-weight="600" fill="#111827">Can you change database?</text>

  <text x="162" y="134" font-size="11.5" fill="#4b5563">yes</text>
  <text x="162" y="224" font-size="11.5" fill="#4b5563">yes</text>
  <text x="162" y="314" font-size="11.5" fill="#4b5563">no</text>
  <text x="352" y="76" text-anchor="middle" font-size="11.5" fill="#4b5563">no: partial or fuzzy</text>
  <text x="352" y="166" text-anchor="middle" font-size="11.5" fill="#4b5563">yes</text>
  <text x="352" y="256" text-anchor="middle" font-size="11.5" fill="#4b5563">yes</text>

  <rect x="420" y="60" width="316" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="578" y="80" text-anchor="middle" font-weight="600" fill="#111827">Search engine (Part 5)</text>
  <text x="578" y="98" text-anchor="middle" font-size="11.5" fill="#4b5563">database stays the source of truth</text>

  <rect x="420" y="150" width="316" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="578" y="170" text-anchor="middle" font-weight="600" fill="#111827">B-Tree index (Part 2)</text>
  <text x="578" y="188" text-anchor="middle" font-size="11.5" fill="#4b5563">simplest: one SQL statement</text>

  <rect x="420" y="240" width="316" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="578" y="260" text-anchor="middle" font-weight="600" fill="#111827">Key-value NoSQL (Part 4)</text>
  <text x="578" y="278" text-anchor="middle" font-size="11.5" fill="#4b5563">very large scale, lookups by key</text>

  <rect x="24" y="330" width="260" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="154" y="350" text-anchor="middle" font-weight="600" fill="#111827">Partition or shard (Part 3)</text>
  <text x="154" y="368" text-anchor="middle" font-size="11.5" fill="#4b5563">stay on SQL, split the table</text>

  <rect x="24" y="404" width="712" height="44" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.25"/>
  <text x="380" y="431" text-anchor="middle" font-size="12" fill="#111827">Then add: cache + Bloom filter (Part 6) for repeats and misses, blind index (Part 7) for personal data</text>
</svg>
