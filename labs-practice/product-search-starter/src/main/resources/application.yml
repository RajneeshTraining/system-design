spring:
  application:
    name: product-search-starter
  profiles:
    default: local
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
app:
  search:
    mode: ${SEARCH_MODE:memory}
    opensearch-url: ${OPENSEARCH_URL:http://localhost:9200}
    index-name: ${OPENSEARCH_INDEX:products-v1}
