server:
  port: 8080

spring:
  application:
    name: twitter-fanout-demo
  threads:
    virtual:
      enabled: true          # Java 21 virtual threads for request handling

management:
  endpoints:
    web:
      exposure:
        include: health,info

twitter:
  celebrity-threshold: 3     # DEMO value. Use ~100000 in a real deployment.
  timeline-max: 800          # max tweet IDs kept per home timeline
  default-page-size: 20
  max-page-size: 100
  worker-id: 1               # Snowflake worker id, 0..1023 (unique per instance)
  fanout-async: true         # false = fan out inside the request (deterministic, handy for debugging)
