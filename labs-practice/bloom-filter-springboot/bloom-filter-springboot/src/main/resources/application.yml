# Default profile = zero-setup quick start (in-memory H2 + 200k demo rows).
# For PostgreSQL run with:  --spring.profiles.active=postgres   (see README)
spring:
  datasource:
    url: jdbc:h2:mem:bloomdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 1000

bloom:
  expected-insertions: 1000000   # capacity: current rows + headroom
  fpp: 0.01                      # 1% false positives at full capacity
  warmup-batch-size: 50000
  warmup-async: true
  snapshot-enabled: false        # keep false for in-memory H2 (ids reset on every start)
  snapshot-path: ./data/email-bloom.snapshot
  snapshot-interval-ms: 600000
  catch-up-safety-margin: 10000

demo:
  seed:
    enabled: true
    rows: 200000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
