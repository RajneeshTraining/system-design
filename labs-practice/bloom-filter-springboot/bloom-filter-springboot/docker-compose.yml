services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bloomdb
      POSTGRES_USER: bloom
      POSTGRES_PASSWORD: bloom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/schema-postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloom -d bloomdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
