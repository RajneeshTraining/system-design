<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Only a keyed hash of the email sits in the index; the plain email stays encrypted" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Only a keyed hash of the email sits in the index; the plain email stays encrypted</title>
  <defs>
    <marker id="p-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#111827">Only a keyed hash sits in the index; the plain email stays encrypted</text>
  <text x="24" y="54" font-size="11.5" fill="#4b5563">WRITE PATH</text>

  <g fill="none" stroke="#6b7280" stroke-width="1.25">
    <path d="M154 123H190" marker-end="url(#p-arrow)"/>
    <path d="M340 123H360V88H380" marker-end="url(#p-arrow)"/>
    <path d="M340 123H360V158H380" marker-end="url(#p-arrow)"/>
    <path d="M570 88H590V123H610" marker-end="url(#p-arrow)"/>
    <path d="M570 158H590V123H610" marker-end="url(#p-arrow)"/>
  </g>

  <rect x="24" y="99" width="130" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="89" y="119" text-anchor="middle" font-weight="600" fill="#111827">New email</text>
  <text x="89" y="137" text-anchor="middle" font-size="11.5" fill="#4b5563">as entered</text>

  <rect x="190" y="99" width="150" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="265" y="119" text-anchor="middle" font-weight="600" fill="#111827">Normalize</text>
  <text x="265" y="137" text-anchor="middle" font-size="11.5" fill="#4b5563">trim, lower-case</text>

  <rect x="380" y="64" width="190" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="475" y="84" text-anchor="middle" font-weight="600" fill="#111827">email_hash (indexed)</text>
  <text x="475" y="102" text-anchor="middle" font-size="11.5" fill="#4b5563">HMAC-SHA256 with secret key</text>

  <rect x="380" y="134" width="190" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="475" y="154" text-anchor="middle" font-weight="600" fill="#111827">email_enc</text>
  <text x="475" y="172" text-anchor="middle" font-size="11.5" fill="#4b5563">AES-GCM, key in a KMS</text>

  <rect x="610" y="99" width="126" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="673" y="119" text-anchor="middle" font-weight="600" fill="#111827">Table row</text>
  <text x="673" y="137" text-anchor="middle" font-size="11.5" fill="#4b5563">holds both</text>

  <text x="24" y="246" font-size="11.5" fill="#4b5563">SEARCH PATH</text>

  <g fill="none" stroke="#6b7280" stroke-width="1.25">
    <path d="M134 292H162" marker-end="url(#p-arrow)"/>
    <path d="M312 292H340" marker-end="url(#p-arrow)"/>
    <path d="M490 292H518" marker-end="url(#p-arrow)"/>
  </g>

  <rect x="24" y="268" width="110" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="79" y="288" text-anchor="middle" font-weight="600" fill="#111827">Email typed</text>
  <text x="79" y="306" text-anchor="middle" font-size="11.5" fill="#4b5563">by the user</text>

  <rect x="162" y="268" width="150" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="237" y="288" text-anchor="middle" font-weight="600" fill="#111827">Normalize + HMAC</text>
  <text x="237" y="306" text-anchor="middle" font-size="11.5" fill="#4b5563">same secret key</text>

  <rect x="340" y="268" width="150" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="415" y="288" text-anchor="middle" font-weight="600" fill="#111827">Index lookup</text>
  <text x="415" y="306" text-anchor="middle" font-size="11.5" fill="#4b5563">on email_hash</text>

  <rect x="518" y="268" width="218" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="627" y="288" text-anchor="middle" font-weight="600" fill="#111827">Decrypt only if needed</text>
  <text x="627" y="306" text-anchor="middle" font-size="11.5" fill="#4b5563">email_enc, via the KMS key</text>

  <text x="380" y="350" text-anchor="middle" font-size="11.5" fill="#4b5563">Plain emails never sit in the index; a leaked index shows only keyed hashes</text>
</svg>
