<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-label="Cheap checks come first and one primary store holds the truth" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Cheap checks come first, one primary store holds the truth</title>
  <defs>
    <marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="352" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#111827">Cheap checks come first, one primary store holds the truth</text>

  <g fill="none" stroke="#6b7280" stroke-width="1.25">
    <path d="M144 110H180" marker-end="url(#map-arrow)"/>
    <path d="M300 110H336" marker-end="url(#map-arrow)"/>
    <path d="M456 110H486" marker-end="url(#map-arrow)"/>
    <path d="M608 154V212" stroke-dasharray="4 4" marker-end="url(#map-arrow)"/>
    <path d="M84 134V240H486" marker-end="url(#map-arrow)"/>
  </g>

  <rect x="24" y="86" width="120" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="84" y="106" text-anchor="middle" font-weight="600" fill="#111827">App</text>
  <text x="84" y="124" text-anchor="middle" font-size="11.5" fill="#4b5563">email lookup</text>

  <rect x="180" y="86" width="120" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="240" y="106" text-anchor="middle" font-weight="600" fill="#111827">Cache</text>
  <text x="240" y="124" text-anchor="middle" font-size="11.5" fill="#4b5563">Part 6</text>
  <text x="240" y="152" text-anchor="middle" font-size="11.5" fill="#4b5563">hit: answer here</text>

  <rect x="336" y="86" width="120" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="396" y="106" text-anchor="middle" font-weight="600" fill="#111827">Bloom filter</text>
  <text x="396" y="124" text-anchor="middle" font-size="11.5" fill="#4b5563">Part 6</text>
  <text x="396" y="152" text-anchor="middle" font-size="11.5" fill="#4b5563">not found: stop</text>

  <rect x="486" y="66" width="244" height="88" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="608" y="90" text-anchor="middle" font-weight="600" fill="#111827">Primary store: pick one</text>
  <text x="608" y="108" text-anchor="middle" font-size="11.5" fill="#111827">B-Tree index (Part 2)</text>
  <text x="608" y="124" text-anchor="middle" font-size="11.5" fill="#111827">Partitioned or sharded SQL (Part 3)</text>
  <text x="608" y="140" text-anchor="middle" font-size="11.5" fill="#111827">Key-value NoSQL (Part 4)</text>

  <rect x="486" y="212" width="244" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="608" y="236" text-anchor="middle" font-weight="600" fill="#111827">Search engine (Part 5)</text>
  <text x="608" y="254" text-anchor="middle" font-size="11.5" fill="#4b5563">partial and fuzzy search</text>

  <text x="620" y="188" font-size="11.5" fill="#4b5563">synced copy</text>
  <text x="285" y="230" text-anchor="middle" font-size="11.5" fill="#4b5563">partial or fuzzy search goes here</text>

  <rect x="24" y="292" width="688" height="36" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.25"/>
  <text x="368" y="314" text-anchor="middle" font-size="12.5" fill="#111827">Part 7: keep a keyed hash of the email, not the plain email, in every store above</text>
</svg>
